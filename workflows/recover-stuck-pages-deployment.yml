name: Recover Stuck GitHub Pages Deployment

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Paste the exact 40-character deployment ID after "Please cancel" in the failed deployment log.'
        required: true
        type: string

permissions:
  contents: read
  pages: write

# Deliberately use a different concurrency group from the deploy workflow so
# recovery can run even while the normal deployment workflow is busy.
concurrency:
  group: github-pages-recovery
  cancel-in-progress: false

jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Validate and cancel only the specified deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOYMENT_ID" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid deployment ID. Paste the exact 40-character hex ID from the Pages error log." >&2
            exit 2
          fi
          echo "Requesting cancellation of the specified Pages deployment: $DEPLOYMENT_ID"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${DEPLOYMENT_ID}/cancel"
          echo "Cancellation requested. Wait briefly, then rerun Deploy ManaSearch to GitHub Pages."
