name: ManaSearch Live Search Quality Benchmark

on:
  push:
    branches: [feature/search-debug-inspector]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: live-search-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-search-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 12-scenario production retrieval and ranking benchmark
        run: node tests/run-live-search-benchmark.cjs
      - name: Upload live-search quality report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manasearch-live-search-quality-${{ github.sha }}
          path: search-quality-benchmark.json
          if-no-files-found: warn
          retention-days: 30
