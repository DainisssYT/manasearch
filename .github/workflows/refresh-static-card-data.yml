name: Refresh ManaSearch static card data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/build-static-data.mjs'
      - 'semantic-card-views.js'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: manasearch-static-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install builder dependencies
        run: npm install --no-audit --no-fund
      - name: Rebuild the card corpus and multi-view semantic index
        run: npm run build-static-data
      - name: Commit regenerated static assets when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cards.bin semantic-index.bin static-data-meta.json; then
            echo "Static card data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards.bin semantic-index.bin static-data-meta.json
          git commit -m "chore: refresh static card and semantic data"
          git push origin HEAD:main
