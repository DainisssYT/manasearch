name: ManaSearch Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run dependency-free checks
        run: |
          node --check --input-type=module < app.js
          node --check scripts/build-static-data.mjs
          node --check scripts/semantic-text.mjs
          node --check semantic-search-worker.js
          npm test
          node tests/run-static-regression.cjs
          node tests/run-core-unit-regression.cjs
          node tests/run-card-benchmark-data.cjs

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium (retry transient package mirror failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Chromium install attempt ${attempt}/3"
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Browser dependency installation failed; retrying after a short delay."
              sleep 20
            fi
          done
          echo "Chromium installation failed after 3 attempts."
          exit 1

      - name: Run production mechanical regression and performance suites
        run: node tests/run-browser-regression.cjs
