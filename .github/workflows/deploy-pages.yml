name: Deploy ManaSearch to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel active deploys: cancellation can leave an orphaned Pages
# deployment that blocks subsequent creates. New pushes wait for the current run.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Assemble and verify the static site (no Node build required)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/tests/fixtures

          # ManaSearch runs entirely in each visitor's browser. This step only
          # assembles the static assets that GitHub Pages serves.
          cp index.html app.js style.css _site/
          for f in pako.min.js cards.bin semantic-index.bin static-data-meta.json; do
            test -s "$f" || { echo "Required static asset missing: $f" >&2; exit 1; }
            cp "$f" _site/
          done

          test -s tests/fixtures/mtg-mechanical-benchmark.json
          cp tests/fixtures/mtg-mechanical-benchmark.json _site/tests/fixtures/
          if [ -s CNAME ]; then cp CNAME _site/; fi
          touch _site/.nojekyll

          for f in index.html app.js style.css pako.min.js cards.bin semantic-index.bin static-data-meta.json tests/fixtures/mtg-mechanical-benchmark.json; do
            test -s "_site/$f" || { echo "Publish artifact missing: $f" >&2; exit 1; }
          done
          grep -Fq 'app.js?v=20261015-76' _site/index.html
          grep -Fq 'pako.min.js?v=20261015-76' _site/index.html
          grep -Fq 'style.css?v=20261015-76' _site/index.html
          grep -Fq "const MANASEARCH_APP_BUILD = '20261015-76'" _site/app.js

          echo 'Verified static Pages artifact:'
          ls -lh _site _site/tests/fixtures

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages using Node 24-compatible action
        id: deployment
        uses: actions/deploy-pages@v5.0.1
