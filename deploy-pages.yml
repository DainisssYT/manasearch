name: Deploy ManaSearch to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install semantic-index builder
        run: npm install --no-audit --no-fund

      - name: Resolve Scryfall Oracle bulk revision
        id: bulk
        shell: bash
        run: |
          revision="$(node scripts/get-scryfall-bulk-revision.mjs)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Scryfall Oracle bulk revision: $revision"

      - name: Restore precomputed semantic index cache
        id: semantic-cache
        uses: actions/cache@v4
        with:
          path: semantic-index.bin
          key: manasearch-semantic-index-${{ steps.bulk.outputs.revision }}

      - name: Build semantic index from Scryfall bulk data
        if: steps.semantic-cache.outputs.cache-hit != 'true'
        run: npm run build:semantic-index -- semantic-index.bin

      - name: Assemble GitHub Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.js style.css semantic-index.bin _site/
          touch _site/.nojekyll
          printf '%s\n' "Scryfall Oracle bulk revision: ${{ steps.bulk.outputs.revision }}" > _site/semantic-index-revision.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
